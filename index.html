            "@type": "Answer",
            "text": "Realizamos atendimentos particulares e também atendemos pelos principais planos de saúde e convênios médicos em Goiânia, incluindo Unimed, Geap Saúde, Caixa Saúde, AFFEGO, Itaú Saúde e outros convênios. Como as regras de cobertura e elegibilidade podem variar conforme a categoria do seu plano ou a unidade de atendimento (Edifício das Clínicas ou Hospital do Rim), entre em contato com a nossa equipe pelo WhatsApp ou telefone para confirmar se o seu plano de saúde é aceito e agendar sua consulta."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona a consulta urológica particular e por plano de saúde?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O atendimento pode acontecer de forma particular ou por plano de saúde / seguro saúde (como Unimed, Geap Saúde, Caixa Saúde, AFFEGO, Itaú Saúde e outros). Em uma consulta aprofundada, dedicamos tempo suficiente para ouvir suas queixas, realizar um exame clínico detalhado e definir um plano terapêutico individualizado. Ao término do atendimento, fornecemos o recibo para as consultas particulares e, se necessário, o relatório médico para que você possa solicitar o reembolso junto ao seu plano de saúde com total comodidade."
          }
        },
        {
          "@type": "Question",
          "name": "Quando o homem deve iniciar o acompanhamento preventivo da próstata com o urologista?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A recomendação da Sociedade Brasileira de Urologia (SBU) é iniciar as consultas de rotina com o médico urologista a partir dos 50 anos. Para homens com histórico de câncer de próstata em familiares de primeiro grau (pai ou irmãos) ou homens negros, o acompanhamento preventivo deve começar mais cedo, aos 45 anos."
          }
        },
        {
          "@type": "Question",
          "name": "Como é a recuperação e o preparo para a cirurgia de Vasectomia em Goiânia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A vasectomia é um procedimento cirúrgico urológico seguro, rápido e realizado com anestesia local. O retorno às atividades leves de escritório ocorre geralmente em 48 a 72 horas. Em consulta prévia, explicamos minuciosamente todas as etapas, orientações pré-operatórias, documentação necessária e os prazos para a confirmação pelo espermograma de controle."
          }
        },
        {
          "@type": "Question",
          "name": "Quais são as opções modernas para tratamento de cálculos renais (pedras nos rins)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A conduta varia conforme a dimensão e localização do cálculo renal. Dispomos de abordagens clínicas medicamentosas e procedimentos endourológicos minimamente invasivos (como a ureterolitotripsia a laser), que fragmentam o cálculo urinário sem necessidade de incisões externas, proporcionando alívio rápido da dor e recuperação ágil."
          }
        },
        {
          "@type": "Question",
          "name": "O que devo levar no dia da primeira consulta médica com o urologista?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "É altamente recomendado apresentar o documento de identificação, a carteirinha do plano de saúde (caso o atendimento seja por convênio como Unimed, Geap Saúde, Caixa Saúde, AFFEGO, Itaú Saúde ou outros), além de todos os exames laboratoriais de sangue e urina recentes, laudos de ultrassonografia, tomografia ou ressonância magnética anteriores e a relação de medicamentos de uso contínuo."
          }
        }
